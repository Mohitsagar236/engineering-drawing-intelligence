x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_PADDLE: ${INSTALL_PADDLE:-false}
  env_file: ./backend/.env
  environment:
    DATABASE_URL: sqlite:////app/data/ed.db
    UPLOAD_DIR: /app/uploads
  volumes:
    - ed_data:/app/data
    - ed_uploads:/app/uploads
    - ed_models:/home/appuser/.EasyOCR
    - ed_paddle_models:/home/appuser/.paddlex
  restart: unless-stopped
  init: true
services:
  migrate:
    <<: *backend
    command: ["alembic","upgrade","head"]
    restart: "no"
  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    expose: ["8000"]
  worker:
    <<: *backend
    command: ["python","-m","app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p=os.path.join(os.environ['UPLOAD_DIR'], '.worker-heartbeat'); age=time.time()-os.stat(p).st_mtime; raise SystemExit(0 if 0 <= age < 15 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
volumes:
  ed_data:
  ed_uploads:
  ed_models:
  ed_paddle_models:
